{% extends "base.html" %}
{% block title %}Too Many Requests — SecureVision{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <p class="font-mono text-8xl font-bold text-[#f59e0b] mb-4" aria-hidden="true">429</p>
    <h1 class="text-2xl font-bold text-white mb-2">Too Many Requests</h1>
    <p class="text-[#8898aa] text-sm mb-6">You have made too many login attempts. Please wait a moment and try again.</p>
    <a href="{{ url_for('auth.login') }}"
       class="inline-block text-sm text-[#4f8ef7] hover:underline focus:underline">
      ← Back to Login
    </a>
  </div>
</div>
{% endblock %}
