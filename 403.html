{% extends "base.html" %}
{% block title %}403 Access Denied — SecureVision{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <p class="font-mono text-8xl font-bold text-[#ff4d6d] mb-4" aria-hidden="true">403</p>
    <h1 class="text-2xl font-bold text-white mb-2">Access Denied</h1>
    <p class="text-[#8898aa] text-sm mb-6">
      Your network or account is not authorised to access this resource.
      The system administrator has been notified.
    </p>
    <a href="{{ url_for('auth.login') }}"
       class="inline-block text-sm text-[#4f8ef7] hover:underline focus:underline"
       aria-label="Return to login page">
      ← Return to Login
    </a>
  </div>
</div>
{% endblock %}
