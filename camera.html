{% extends "base.html" %}
{% block title %}Live Camera — SecureVision{% endblock %}

{% block content %}
<div class="p-6 lg:p-8">
  <header class="mb-6">
    <h1 class="text-2xl font-bold text-white">Live Camera Feed</h1>
    <p class="text-[#8898aa] text-sm mt-1">Real-time MJPEG stream from the connected camera source.</p>
  </header>

  <section class="card p-4" aria-label="Full screen live camera feed">
    <div class="relative bg-black rounded-lg overflow-hidden" style="max-height:70vh;">
      <img
        src="{{ url_for('camera.feed') }}"
        alt="Full-screen live security camera feed. The stream updates in real time."
        class="w-full object-contain"
        style="max-height:70vh;"
        aria-live="polite"
      />
      <div class="absolute top-3 left-3 flex items-center gap-2 px-3 py-1.5
                  bg-black/70 rounded-full text-xs font-mono"
           role="status" aria-label="Stream is live">
        <span class="w-2 h-2 rounded-full bg-[#ff4d6d] animate-pulse" aria-hidden="true"></span>
        <span class="text-white">LIVE STREAM</span>
      </div>
    </div>
    <p class="mt-3 text-xs text-[#8898aa] text-center">
      Stream auto-refreshes. If the feed is blank, check that the camera source is connected.
    </p>
  </section>
</div>
{% endblock %}
